# /etc/nginx/sites-available/catalog  — C201 자료 서버 (AS-04: 인증 없음, autoindex 허용)
# 정적 파일(/files, /preview, 화면)은 nginx 가 직접, /api 만 FastAPI(127.0.0.1:8412)로 넘긴다.

types {
    model/gltf-binary   glb;
    model/gltf+json     gltf;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                  # default_server 라 호스트 이름과 상관없이 받는다 — 주소는 저장소에 두지 않는다
    charset utf-8;

    root  /srv/catalog/web;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 2g;          # 복원본 업로드 (POST /api/artifacts/{id}/restored). 앱에서도 2GB 로 막는다

    # 시연 장소(굴) 회선이 약하다는 피드백 — 텍스트는 전부 압축해서 보낸다.
    # three.module.js 만 1.2 MB 인데 gzip 이면 1/4 이 된다. 목록 JSON·화면 JS/CSS 도 같이.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/x-javascript model/gltf+json image/svg+xml;
    gzip_proxied any;                 # /api 응답도 (proxy 뒤라 기본은 안 눌린다)

    # 화면 (빌드 없는 정적 HTML)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # API
    location /api/ {
        proxy_pass         http://127.0.0.1:8412/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_read_timeout 1800s;       # /api/rescan 은 오래 걸릴 수 있음
        proxy_request_buffering off;    # 큰 업로드를 디스크에 통째로 받지 않고 그대로 흘려보낸다
        proxy_send_timeout 1800s;
    }

    # 원본 파일 — nginx 직접 서빙, 디렉터리 브라우징 허용
    location /files/ {
        alias /srv/catalog/files/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        gzip_static on;
        add_header Access-Control-Allow-Origin *;
        # 하루. 화면이 붙이는 ?v=<수정시각> 이 내용이 바뀌면 URL 을 바꾸므로 길게 잡아도 옛 것이 남지 않는다
        add_header Cache-Control "public, max-age=86400";
        # 텍스트 포맷이 브라우저에 그대로 뿌려지지 않게. (alias 안 중첩 location 은 add_header 를 상속하지 않으므로 다시 적는다)
        location ~* \.(obj|mtl|ply|stl|las|npy)$ {
            add_header Content-Disposition 'attachment';
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
            gzip_static on;
        }
    }

    # 폴더 ZIP — /api/zip 이 만들어 두면 nginx 가 내준다 (OBJ+MTL+텍스처를 한 번에)
    location /zips/ {
        alias /srv/catalog/zips/;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "no-cache";
    }

    # 프리뷰 GLB·썸네일 — 뷰어가 fetch
    location /preview/ {
        alias /srv/catalog/preview/;
        gzip_static on;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=604800";
    }

    access_log /var/log/nginx/catalog.access.log;
    error_log  /var/log/nginx/catalog.error.log;
}
